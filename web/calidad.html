<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reglas de Calidad - Informes</title>
<link rel="stylesheet" href="/ui_base.css">
<style>
  :root{
    --rojo:#E5002B; --vino:#960047; --vino2:#7d003b;
    --tinta:#2b2b2b; --suave:#6b7280; --linea:#e3e3e8; --gris:#f6f7f9;
    --ok:#1f7a52; --ok-bg:#e3f3ea; --no:#C8102E; --no-bg:#fae9e7;
    --warn:#9a6b16; --warn-bg:#fbf0d9;
    --mono:"Consolas",ui-monospace,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  html,body{background:#fff;color:var(--tinta);font-family:var(--sans);font-size:14px;line-height:1.5}
  .subnav{padding:10px 26px 0;font-size:13px}
  .subnav a{color:var(--suave);text-decoration:none;margin-right:14px}
  .subnav a.activo{color:var(--vino);font-weight:600}
  .superior{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 26px 0}
  .superior select{padding:8px 10px;border:1px solid var(--linea);border-radius:6px;font-size:13.5px;min-width:260px}
  .metricas{display:flex;gap:10px;flex-wrap:wrap}
  .metrica{border:1px solid var(--linea);border-radius:8px;padding:6px 14px;min-width:78px;text-align:center}
  .metrica .n{font-size:19px;font-weight:700;line-height:1.1;color:var(--vino)}
  .metrica .n.n-alta{color:var(--no)} .metrica .n.n-media{color:var(--warn)}
  .metrica .l{font-size:10px;color:var(--suave);text-transform:uppercase;letter-spacing:.4px}
  .acc{margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--linea);
       border-radius:8px;padding:8px 12px;background:var(--gris)}
  .acc .txt{font-size:12.5px;color:var(--suave)}
  .btn{border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-pub{background:var(--vino);color:#fff}
  .btn:hover:not(:disabled){filter:brightness(1.06)}
  .wrap{display:grid;grid-template-columns:360px 1fr;height:calc(100% - 165px)}
  .lista{border-right:1px solid var(--linea);overflow-y:auto;padding:14px 14px 70px}
  .barra-l{display:flex;align-items:center;gap:8px;margin:2px 2px 10px}
  .barra-l h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);margin:0;font-weight:700}
  .barra-l .cuenta{margin-left:auto;font-size:12px;color:var(--suave)}
  .item{border:1px solid var(--linea);border-radius:9px;padding:10px 12px;margin-bottom:9px;background:#fff;cursor:pointer}
  .item:hover{border-color:#cdb0bd}
  .item.sel{border-color:var(--vino);box-shadow:0 0 0 2px rgba(150,0,71,.14)}
  .item .col{font-family:var(--mono);font-size:12.5px;color:var(--vino2);font-weight:650;word-break:break-all}
  .item .desc{font-size:12px;color:var(--suave);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .badge{font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center}
  .b-alta{background:var(--no-bg);color:var(--no)} .b-media{background:var(--warn-bg);color:var(--warn)}
  .b-baja{background:#eef1f5;color:var(--suave)} .b-anom{background:#eef1f5;color:var(--vino)}
  .b-tipo{background:var(--gris);color:var(--suave)}
  .detalle{overflow-y:auto;padding:20px 26px 70px}
  .vacio{display:flex;height:100%;align-items:center;justify-content:center;color:var(--suave);text-align:center}
  .dcab .col{font-family:var(--mono);font-size:15px;font-weight:650;color:var(--vino2);word-break:break-all}
  .dcab .badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .ficha{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:6px 18px 16px;margin-top:14px}
  .campo{padding:13px 0;border-bottom:1px solid var(--gris)}
  .campo:last-child{border-bottom:none}
  .et{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);font-weight:700;margin-bottom:5px}
  .resp{font-size:14px;line-height:1.55;background:var(--gris);border:1px solid var(--linea);border-radius:8px;padding:10px 12px}
  table.muestra{width:100%;border-collapse:collapse;font-size:12px}
  table.muestra th{background:var(--vino);color:#fff;text-align:left;padding:6px 8px;font-size:11px;white-space:nowrap}
  table.muestra td{padding:5px 8px;border-bottom:1px solid var(--linea);font-family:var(--mono);white-space:nowrap}
  table.est{width:100%;border-collapse:collapse;font-size:13px}
  table.est td{padding:5px 8px;border-bottom:1px solid var(--linea)}
  table.est td.k{color:var(--suave);width:200px}
  .cargando{color:var(--suave);padding:24px;text-align:center}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--vino2);color:#fff;
         padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:0;transition:.25s;z-index:70}
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  #toast.no{background:var(--no)}
  @media(max-width:820px){ .wrap{grid-template-columns:1fr;height:auto} .lista{border-right:none;border-bottom:1px solid var(--linea)} }
</style>
</head>
<body>
<div class="topbar">
  <a href="/calidad" class="brand">Reglas de Calidad</a>
  <nav class="nav">
    <a href="/calidad" class="activo">Calidad</a>
  </nav>
</div>
<div class="subnav">
  <a href="/calidad" class="activo">Informes</a>
  <a href="/calidad/reglas">Reglas pendientes</a>
  <a href="/calidad/evaluacion">Evaluación LLM</a>
</div>

<div class="superior">
  <select id="selConfig" onchange="cambiarConfig()"></select>
  <div class="metricas" id="metricas"></div>
  <div class="acc">
    <span class="txt" id="tablaTxt">—</span>
    <button class="btn btn-pub" id="btnEjecutar" onclick="ejecutarAhora()">Ejecutar ahora</button>
  </div>
</div>

<div class="wrap">
  <aside class="lista">
    <div class="barra-l">
      <h2>Hallazgos</h2>
      <span class="cuenta" id="cuenta"></span>
    </div>
    <div id="items"><div class="cargando">Cargando...</div></div>
  </aside>

  <main class="detalle" id="detalle">
    <div class="vacio">Selecciona un hallazgo de la izquierda para ver el detalle.</div>
  </main>
</div>

<div class="footer">
  <span>Reglas de Calidad · la entidad</span>
  <span><a href="/calidad">Informes</a><a href="/calidad/reglas">Reglas pendientes</a></span>
</div>

<div id="toast"></div>

<script>
const DataAPI = {
  async configs(){ const r = await fetch('/api/calidad/configs'); if(!r.ok) throw new Error('No se pudieron listar las configs'); return await r.json(); },
  async informe(config){ const r = await fetch(`/api/calidad/informe?config=${encodeURIComponent(config)}`); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'No se pudo cargar el informe'); return j; },
  async ejecutar(config){ const r = await fetch('/api/calidad/ejecutar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config})}); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'No se pudo ejecutar el agente'); return j; }
};

let estado = { config:null, informe:null, hallazgos:[], selIdx:null };

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function claseSev(sev){ return sev==='alta'?'b-alta':(sev==='media'?'b-media':'b-baja'); }

let _toastT;
function toast(msg,tipo){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show '+(tipo||'');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.className='',3200); }

function construirHallazgos(informe){
  const out = [];
  (informe.incidencias_reglas||[]).forEach(h=>{ if(h.total_incumplen>0) out.push({tipo:'regla', ...h}); });
  (informe.anomalias||[]).forEach(a=>{ if(a.total_filas_atipicas>0) out.push({tipo:'anomalia', ...a}); });
  return out;
}

function pintarMetricas(informe){
  const r = informe.resumen||{};
  const ps = r.por_severidad||{};
  document.getElementById('metricas').innerHTML = `
    <div class="metrica"><div class="n">${r.total_reglas??'—'}</div><div class="l">Reglas</div></div>
    <div class="metrica"><div class="n">${r.reglas_incumplidas??'—'}</div><div class="l">Incumplidas</div></div>
    <div class="metrica"><div class="n n-alta">${ps.alta||0}</div><div class="l">Severidad alta</div></div>
    <div class="metrica"><div class="n n-media">${ps.media||0}</div><div class="l">Severidad media</div></div>
    <div class="metrica"><div class="n">${r.anomalias_detectadas??'—'}</div><div class="l">Anomalías</div></div>`;
  document.getElementById('tablaTxt').textContent = informe.tabla || '—';
}

function pintarLista(){
  document.getElementById('cuenta').textContent = estado.hallazgos.length+' hallazgo(s)';
  const cont = document.getElementById('items');
  if(!estado.hallazgos.length){
    cont.innerHTML = '<div style="color:var(--suave);font-size:13px;padding:18px 6px;text-align:center">Sin incidencias: todas las reglas se cumplen y no hay anomalías.</div>';
    return;
  }
  cont.innerHTML = estado.hallazgos.map((h,i)=>{
    const col = h.tipo==='regla' ? h.columna : h.columna;
    const total = h.tipo==='regla' ? h.total_incumplen : h.total_filas_atipicas;
    const desc = h.tipo==='regla' ? (h.descripcion||h.regla) : `${h.tipo_anomalia} · ${total} fila(s) atípica(s)`;
    const badgeSev = h.tipo==='regla' ? `<span class="badge ${claseSev(h.severidad)}">${esc(h.severidad)}</span>` : `<span class="badge b-anom">anomalía</span>`;
    return `<div class="item ${i===estado.selIdx?'sel':''}" onclick="seleccionar(${i})">
      <div class="col">${esc(col)}</div>
      <div class="desc">${esc(desc)}</div>
      <div class="meta">${badgeSev}<span class="badge b-tipo">${esc(h.tipo==='regla'?h.regla:'estadística')}</span>
        <span class="badge b-tipo">${total} fila(s)</span></div>
    </div>`;
  }).join('');
}

function tablaMuestra(muestra){
  if(!muestra || !muestra.length) return '<div style="color:var(--suave);font-size:13px">Sin muestra de filas.</div>';
  const cols = Object.keys(muestra[0]);
  let html = '<div style="overflow-x:auto"><table class="muestra"><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>';
  html += muestra.map(f=>'<tr>'+cols.map(c=>`<td>${esc(f[c])}</td>`).join('')+'</tr>').join('');
  html += '</tbody></table></div>';
  return html;
}

function tablaDetalleEstadistico(det){
  if(!det || !Object.keys(det).length) return '';
  const filas = Object.entries(det).map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(typeof v==='number'?Math.round(v*10000)/10000:v)}</td></tr>`).join('');
  return `<table class="est">${filas}</table>`;
}

function seleccionar(i){
  estado.selIdx = i;
  pintarLista();
  const h = estado.hallazgos[i];
  const esRegla = h.tipo==='regla';
  const badgeSev = esRegla ? `<span class="badge ${claseSev(h.severidad)}">severidad ${esc(h.severidad)}</span>` : `<span class="badge b-anom">anomalía estadística</span>`;
  let html = `<div class="dcab"><div class="col">${esc(h.columna)}</div>
    <div class="badges">${badgeSev}<span class="badge b-tipo">${esc(esRegla?h.regla:h.tipo_anomalia)}</span></div></div>
    <div class="ficha">`;
  html += `<div class="campo"><div class="et">Descripción</div><div>${esc(esRegla?(h.descripcion||h.regla):(h.tipo_anomalia+' sobre '+h.columna))}</div></div>`;
  html += `<div class="campo"><div class="et">${esRegla?'Filas que incumplen':'Filas atípicas'}</div><div>${esRegla?h.total_incumplen:h.total_filas_atipicas}</div></div>`;
  if(!esRegla && h.detalle_estadistico){
    html += `<div class="campo"><div class="et">Detalle estadístico</div>${tablaDetalleEstadistico(h.detalle_estadistico)}</div>`;
  }
  if(h.aviso){ html += `<div class="campo"><div class="et">Aviso</div><div class="resp">${esc(h.aviso)}</div></div>`; }
  html += `<div class="campo"><div class="et">Muestra de filas</div>${tablaMuestra(h.muestra)}</div>`;
  if(h.explicacion){ html += `<div class="campo"><div class="et">Explicación (LLM)</div><div class="resp">${esc(h.explicacion)}</div></div>`; }
  html += `</div>`;
  document.getElementById('detalle').innerHTML = html;
}

async function cargarInforme(mostrarError){
  document.getElementById('items').innerHTML = '<div class="cargando">Cargando informe...</div>';
  document.getElementById('detalle').innerHTML = '<div class="vacio">Selecciona un hallazgo de la izquierda para ver el detalle.</div>';
  try{
    const informe = await DataAPI.informe(estado.config);
    estado.informe = informe;
    estado.hallazgos = construirHallazgos(informe);
    estado.selIdx = null;
    pintarMetricas(informe);
    pintarLista();
  }catch(e){
    document.getElementById('items').innerHTML = '';
    document.getElementById('detalle').innerHTML = `<div class="vacio">${esc(e.message)}</div>`;
    if(mostrarError) toast(e.message,'no');
  }
}

function cambiarConfig(){
  estado.config = document.getElementById('selConfig').value;
  cargarInforme(false);
}

async function ejecutarAhora(){
  if(!estado.config){ toast('Elige antes una configuración.','no'); return; }
  const btn = document.getElementById('btnEjecutar');
  btn.disabled = true; btn.textContent = 'Ejecutando...';
  try{
    const informe = await DataAPI.ejecutar(estado.config);
    estado.informe = informe;
    estado.hallazgos = construirHallazgos(informe);
    estado.selIdx = null;
    pintarMetricas(informe);
    pintarLista();
    document.getElementById('detalle').innerHTML = '<div class="vacio">Selecciona un hallazgo de la izquierda para ver el detalle.</div>';
    toast('Ejecución completada.','ok');
  }catch(e){
    toast(e.message,'no');
  }finally{
    btn.disabled = false; btn.textContent = 'Ejecutar ahora';
  }
}

async function init(){
  try{
    const configs = await DataAPI.configs();
    const sel = document.getElementById('selConfig');
    if(!configs.length){
      sel.innerHTML = '<option value="">Sin configs disponibles</option>';
      document.getElementById('items').innerHTML = '';
      document.getElementById('detalle').innerHTML = '<div class="vacio">No hay ningún fichero reglas_calidad_*.json en el repo.</div>';
      return;
    }
    sel.innerHTML = configs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    estado.config = configs[0];
    cargarInforme(false);
  }catch(e){
    document.getElementById('detalle').innerHTML = `<div class="vacio">No se pudo conectar con la API. ¿Está arrancado el servicio? (${esc(e.message)})</div>`;
  }
}
init();
</script>
</body>
</html>
